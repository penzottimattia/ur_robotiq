# Example mock configuration: starts static camera TF, mocked detected objects,
# spawn markers from the mocked topics, and transformers.

rviz:
  config: ''

static_camera_tf:
  enabled: true

mocks:
  - name: vial_mock
    frame: world
    target_frame: world
    rate: 1.0
    offset_xyz: [-0.4, 0.4, 0.0]
    offset_rpy: [0.0, 0.0, -1.57]
    output_topic: /object_pose/vial_tube
    gt_topic: /object_pose/vial_tube_gt

  - name: rack_mock
    frame: world
    target_frame: world
    rate: 40.0
    offset_xyz: [-0.4, 0.3, 0.0]
    offset_rpy: [1.57, 0.0, 0.0]
    output_topic: /object_pose/cap
    gt_topic: /object_pose/cap_gt

objects:

  - name: cap_gt
    mesh: /ws/src/ur_robotiq/object/cap/cap.obj
    pose_topic: /object_pose/cap_gt
    frame: world
    scale: 1.0

  - name: vial_tube_gt
    mesh: /ws/src/ur_robotiq/object/vial_tube/vial_tube.obj
    pose_topic: /object_pose/vial_tube_gt
    frame: world
    scale: 1.0

transforms:
  - input_topic: /object_pose/cap_gt
    output_topic: /object_detection/cap
    target_frame: world

  - input_topic: /object_pose/vial_tube_gt
    output_topic: /object_detection/vial_tube
    target_frame: world
