controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    right_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    right_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_gripper_controller:
  ros__parameters:
    joints:
      - left_robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0

right_gripper_controller:
  ros__parameters:
    joints:
      - right_robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0
      
left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0
      left_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      left_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      left_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      left_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    gains.left_shoulder_pan_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.left_shoulder_lift_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.left_elbow_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.left_wrist_1_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.left_wrist_2_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.left_wrist_3_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0, angle_wraparound: true }

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0
      right_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      right_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      right_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      right_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      right_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      right_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    gains.right_shoulder_pan_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.right_shoulder_lift_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.right_elbow_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.right_wrist_1_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.right_wrist_2_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0 }
    gains.right_wrist_3_joint: { p: 5.0, i: 0.0, d: 0.0, ff_velocity_scale: 0.0, angle_wraparound: true }

left_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
      - left_robotiq_85_left_knuckle_joint
    interfaces:
      - position
      - velocity

right_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
      - right_robotiq_85_left_knuckle_joint
    interfaces:
      - position
      - velocity

left_fts_broadcaster:
  ros__parameters:
    sensor_name: left_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: left_ft_sensor_frame
    topic_name: ft_data

right_fts_broadcaster:
  ros__parameters:
    sensor_name: right_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: right_ft_sensor_frame
    topic_name: ft_data