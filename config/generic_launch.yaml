# Example configuration for generic launch that starts camera TF, spawn markers, and transformers
# - objects: list of meshes to spawn as visualization markers
# - transforms: list of input/output topic mappings for tf_pose_transformer
# - rviz: optional rviz configuration file path

rviz:
  config: ''

static_camera_tf:
  enabled: true

objects:
  - name: black_bolt
    mesh: /ws/src/ur_robotiq/object/black_bolt/black_bolt.obj
    pose_topic: /object_pose_fused/white_bolt
    frame: robotcam_color_optical_frame
    scale: 1.0

  - name: black_nut
    mesh: /ws/src/ur_robotiq/object/black_nut/black_nut.obj
    pose_topic: /object_pose_fused/red_nut
    frame: robotcam_color_optical_frame
    scale: 1.0

  - name: black_nut_avg
    mesh: /ws/src/ur_robotiq/object/black_nut/black_nut.obj
    pose_topic: /object_detection/black_nut
    frame: world
    child_frame: nut_avg
    scale: 1.0

  - name: black_bolt_avg
    mesh: /ws/src/ur_robotiq/object/black_bolt/black_bolt.obj
    pose_topic: /object_detection/black_bolt
    frame: world
    child_frame: bolt_avg
    scale: 1.0

  - name: black_bolt_est
    mesh: /ws/src/ur_robotiq/object/black_bolt/black_bolt.obj
    pose_topic: /rr_asset_publisher_pose
    frame: world
    child_frame: bolt_est
    scale: 1.0

  - name: black_nut_est
    mesh: /ws/src/ur_robotiq/object/black_nut/black_nut.obj
    pose_topic: /ll_asset_publisher_pose
    frame: world
    child_frame: nut_est
    scale: 1.0

transforms:
  - input_topic: /object_pose_fused/white_bolt
    output_topic: /object_detection/black_bolt
    target_frame: world
    publish_rate: 2.0

  - input_topic: /object_pose_fused/red_nut
    output_topic: /object_detection/black_nut
    target_frame: world
    publish_rate: 2.0
    
