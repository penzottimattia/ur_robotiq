# Example configuration for generic launch that starts camera TF, spawn markers, and transformers
# - objects: list of meshes to spawn as visualization markers
# - transforms: list of input/output topic mappings for tf_pose_transformer
# - rviz: optional rviz configuration file path

rviz:
  config: ''

static_camera_tf:
  enabled: true

objects:
  - name: flask
    mesh: /ws/src/ur_robotiq/object/flask/flask.obj
    pose_topic: /object_pose/flask
    frame: camera_color_optical_frame
    scale: 1.0

  - name: cap_
    mesh: /ws/src/ur_robotiq/object/cap_/cap_.obj
    pose_topic: /object_pose/cap_
    frame: camera_color_optical_frame
    scale: 1.0

transforms:
  - input_topic: /object_pose/flask
    output_topic: /object_detection/flask
    target_frame: world

  - input_topic: /object_pose/cap_
    output_topic: /object_detection/cap_
    target_frame: world

