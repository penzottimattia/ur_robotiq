controller_manager:
  ros__parameters:
    update_rate: 33

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    right_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_gripper_controller:
      type: pid_controller/PidController

    right_gripper_controller:
      type: pid_controller/PidController

    left_hand_controller:
      type: position_controllers/JointGroupPositionController

    right_hand_controller:
      type: position_controllers/JointGroupPositionController

    left_cartesian_controller:
      type: cartesian_motion_controller/CartesianMotionController
    
    right_cartesian_controller:
      type: cartesian_motion_controller/CartesianMotionController

left_gripper_controller:
  ros__parameters:
    dof_names:
      - left_hand_j_index_fle
      - left_hand_j_thumb_fle
      - left_hand_j_mrl_fle
    command_interface: velocity
    reference_and_state_interfaces: ["position"]
    gains:
      left_hand_j_thumb_fle:
        p: 5.5
        i: 0.2
        d: 0.0
        antiwindup_strategy: "back_calculation"
      left_hand_j_index_fle:
        p: 5.0
        i: 0.01
        d: 0.0
        antiwindup_strategy: "back_calculation"
      left_hand_j_mrl_fle:
        p: 5.0
        i: 0.01
        d: 0.0
        antiwindup_strategy: "back_calculation"

right_gripper_controller:
  ros__parameters:
    dof_names:
      - right_hand_j_index_fle
      - right_hand_j_thumb_fle
      - right_hand_j_mrl_fle
    command_interface: velocity
    reference_and_state_interfaces: ["position"]
    gains:
      right_hand_j_thumb_fle:
        p: 5.5
        i: 0.2
        d: 0.0
        antiwindup_strategy: "back_calculation"
      right_hand_j_index_fle:
        p: 5.0
        i: 0.01
        d: 0.0
        antiwindup_strategy: "back_calculation"
      right_hand_j_mrl_fle:
        p: 5.0
        i: 0.01
        d: 0.0
        antiwindup_strategy: "back_calculation"
      
left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0
    gains.left_shoulder_pan_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.left_shoulder_lift_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.left_elbow_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.left_wrist_1_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.left_wrist_2_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.left_wrist_3_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain), angle_wraparound: true }

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.0
    gains.right_shoulder_pan_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.right_shoulder_lift_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.right_elbow_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.right_wrist_1_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.right_wrist_2_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain) }
    gains.right_wrist_3_joint: { p: $(var proportional_gain), i: 0.0, d: 0.0, ff_velocity_scale: $(var feedforward_gain), angle_wraparound: true }

left_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
      - left_hand_j_index_fle
      - left_hand_j_thumb_fle
      - left_hand_j_mrl_fle
    interfaces:
      - position
      - velocity

right_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
      - right_hand_j_index_fle
      - right_hand_j_thumb_fle
      - right_hand_j_mrl_fle
    interfaces:
      - position
      - velocity

left_hand_controller:
  ros__parameters:
    joints:
      - left_hand_j_thumb_fle
      - left_hand_j_index_fle
      - left_hand_j_mrl_fle

right_hand_controller:
  ros__parameters:
    joints:
      - right_hand_j_thumb_fle
      - right_hand_j_index_fle
      - right_hand_j_mrl_fle

left_cartesian_controller:
  ros__parameters:
    end_effector_link: left_dorsum_link
    robot_base_link: world
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint 
    command_interfaces:
      - position
    solver:
        error_scale: 1.0
        iterations: 10
        publish_state_feedback: True
    pd_gains:
        trans_x: {p: 10.0}
        trans_y: {p: 10.0}
        trans_z: {p: 10.0}
        rot_x: {p: 2.0}
        rot_y: {p: 2.0}
        rot_z: {p: 2.0}

right_cartesian_controller:
  ros__parameters:
    end_effector_link: right_dorsum_link
    robot_base_link: world
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint 
    command_interfaces:
      - position
    solver:
        error_scale: 1.0
        iterations: 10
        publish_state_feedback: True
    pd_gains:
        trans_x: {p: 10.0}
        trans_y: {p: 10.0}
        trans_z: {p: 10.0}
        rot_x: {p: 2.0}
        rot_y: {p: 2.0}
        rot_z: {p: 2.0}